<!DOCTYPE html>
<html lang ="en">

 <head>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title> MB Portfolio - Contact</title>
	<link href="css/portfolio.css" rel="stylesheet" type="text/css"/>
	<link rel="stylesheet" href="https://use.typekit.net/dzq6gvq.css">


</head>

<body>

   <header id="top">
   <section id="banner"></section>
   <nav id="navbar">
		<a href="index.html" class="logo">
			<img src="images/name-illustrator.png" alt="Maya Berinhout Illustrator">
			</a>
			<ul>
				<li><a href="index.html">Home</a></li>
				<li><a href="about.html">About</a></li>
				<li><a href="index.html#portfolio">Portfolio</a></li>
				<li><a href="shop.html">Shop</a></li>
				<li><a class="active" href="contact.html">Contact</a></li>
			</ul>
		
	</nav>
   </header>
 
 <main>
	<section id="contact">
		<form class="contact-grid">
		  <h2 class="contact-title">Let’s Work Together</h2>
				<p id="cta">Contact me for commissions, collaborations, or illustration projects.</p>		  
				<p id="myinfo">(404) 625-3784</br>
				mberinhout5@gmail.com</br>
				Social Media...</p>	   
					 


			<div class="contact-left">
			  <input type="text" name="name" placeholder="Name" />
			  <input type="text" name="subject" placeholder="Subject" />
			  <input type="email" name="email" placeholder="Email" />
			  <input type="tel" name="phone" placeholder="Phone number" />
			</div>

			<div class="contact-right">
			  <textarea placeholder="Message"></textarea>
			  <input type="submit" value="SEND" />
			</div>
		  </form>
	</section>
   </main>
</body>
</html>
